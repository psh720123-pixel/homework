<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과제 마감 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-slate-50 to-blue-50 min-h-screen text-slate-800 flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <header class="w-full bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-20 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="bg-indigo-600 text-white p-2.5 rounded-2xl shadow-md shadow-indigo-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-900">과제 관리 웹앱</h1>
                    <p class="text-xs text-slate-500">스마트한 학업 스케줄러</p>
                </div>
            </div>
            <div id="statsBadge" class="text-xs font-semibold bg-indigo-50 text-indigo-700 px-3.5 py-1.5 rounded-full border border-indigo-100 shadow-sm">
                진행중 0건
            </div>
        </div>
    </header>

    <main class="max-w-md w-full mx-auto px-4 py-6 flex-1 flex flex-col">
        <!-- Filter Tabs -->
        <div class="flex space-x-2 mb-5 bg-slate-200/60 p-1 rounded-xl text-sm font-medium">
            <button onclick="setFilter('all')" id="filter-all" class="flex-1 py-2 rounded-lg transition bg-white shadow-sm text-indigo-600 font-semibold">전체</button>
            <button onclick="setFilter('active')" id="filter-active" class="flex-1 py-2 rounded-lg transition text-slate-600 hover:text-slate-900">진행중</button>
            <button onclick="setFilter('completed')" id="filter-completed" class="flex-1 py-2 rounded-lg transition text-slate-600 hover:text-slate-900">완료됨</button>
        </div>

        <!-- Assignment List Section -->
        <div id="assignmentList" class="space-y-3.5 flex-1 pb-20">
            <!-- Dynamic items will be inserted here -->
        </div>

        <!-- Empty State Container -->
        <div id="emptyState" class="hidden flex-col items-center justify-center my-auto py-12 text-center">
            <div class="w-20 h-20 bg-indigo-50 text-indigo-400 rounded-full flex items-center justify-center mb-4 shadow-inner">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"></path>
                </svg>
            </div>
            <h3 class="text-base font-semibold text-slate-700 mb-1">등록된 과제가 없습니다</h3>
            <p class="text-xs text-slate-500 max-w-xs">아래의 '과제 추가하기' 버튼을 눌러 새로운 과제를 등록하고 마감일을 관리해보세요.</p>
        </div>
    </main>

    <div class="sticky bottom-0 left-0 right-0 bg-gradient-to-t from-slate-50 via-slate-50/90 to-transparent pt-4 pb-6 px-4 z-10">
        <div class="max-w-md mx-auto">
            <button onclick="openModal()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-semibold py-3.5 px-4 rounded-2xl shadow-lg shadow-indigo-500/25 transition transform active:scale-95 flex items-center justify-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
                </svg>
                <span>과제 추가하기</span>
            </button>
        </div>
    </div>

    <div id="assignmentModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="modalContent" class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl transform translate-y-full sm:translate-y-0 sm:scale-95 transition-transform duration-300">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-bold text-slate-900">새 과제 추가</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-full hover:bg-slate-100 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <form id="assignmentForm" onsubmit="addAssignment(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wider">과목명 및 과제 제목</label>
                    <input type="text" id="titleInput" required placeholder="예: 알고리즘 과제 3번" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wider">마감일 및 시간</label>
                    <input type="datetime-local" id="dateInput" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wider">카테고리 색상</label>
                    <div class="flex space-x-3 pt-1">
                        <label class="cursor-pointer">
                            <input type="radio" name="color" value="indigo" checked class="peer sr-only">
                            <div class="w-8 h-8 rounded-full bg-indigo-600 ring-offset-2 peer-checked:ring-2 peer-checked:ring-indigo-600 transition"></div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="color" value="blue" class="peer sr-only">
                            <div class="w-8 h-8 rounded-full bg-blue-500 ring-offset-2 peer-checked:ring-2 peer-checked:ring-blue-500 transition"></div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="color" value="emerald" class="peer sr-only">
                            <div class="w-8 h-8 rounded-full bg-emerald-500 ring-offset-2 peer-checked:ring-2 peer-checked:ring-emerald-500 transition"></div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="color" value="amber" class="peer sr-only">
                            <div class="w-8 h-8 rounded-full bg-amber-500 ring-offset-2 peer-checked:ring-2 peer-checked:ring-amber-500 transition"></div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="color" value="rose" class="peer sr-only">
                            <div class="w-8 h-8 rounded-full bg-rose-500 ring-offset-2 peer-checked:ring-2 peer-checked:ring-rose-500 transition"></div>
                        </label>
                    </div>
                </div>
                <div class="pt-3">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow-md transition">등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let assignments = JSON.parse(localStorage.getItem('assignments')) || [
            { id: 1, title: '웹프로그래밍 중간과제', dueDate: '2026-04-15T23:59', completed: false, color: 'indigo' },
            { id: 2, title: '데이터베이스 쿼리 작성', dueDate: '2026-04-10T18:00', completed: false, color: 'blue' },
            { id: 3, title: '운영체제 리포트 제출', dueDate: '2026-04-02T12:00', completed: true, color: 'emerald' }
        ];
        let currentFilter = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            renderAssignments();
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setMinutes(tomorrow.getMinutes() - tomorrow.getTimezoneOffset());
            document.getElementById('dateInput').value = tomorrow.toISOString().slice(0, 16);
        });

        function saveAssignments() {
            localStorage.setItem('assignments', JSON.stringify(assignments));
        }

        function openModal() {
            const modal = document.getElementById('assignmentModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('translate-y-full', 'sm:scale-95');
            content.classList.add('translate-y-0', 'sm:scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('assignmentModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('opacity-0', 'pointer-events-none');
            content.classList.remove('translate-y-0', 'sm:scale-100');
            content.classList.add('translate-y-full', 'sm:scale-95');
        }

        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'active', 'completed'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = 'flex-1 py-2 rounded-lg transition bg-white shadow-sm text-indigo-600 font-semibold';
                } else {
                    btn.className = 'flex-1 py-2 rounded-lg transition text-slate-600 hover:text-slate-900';
                }
            });
            renderAssignments();
        }

        function addAssignment(e) {
            e.preventDefault();
            const title = document.getElementById('titleInput').value.trim();
            const dueDate = document.getElementById('dateInput').value;
            const colorEl = document.querySelector('input[name="color"]:checked');
            const color = colorEl ? colorEl.value : 'indigo';

            if (!title || !dueDate) return;

            const newAssignment = {
                id: Date.now(),
                title,
                dueDate,
                completed: false,
                color
            };

            assignments.push(newAssignment);
            saveAssignments();
            renderAssignments();
            closeModal();
            document.getElementById('assignmentForm').reset();
        }

        function toggleAssignment(id) {
            assignments = assignments.map(item => {
                if (item.id === id) {
                    return { ...item, completed: !item.completed };
                }
                return item;
            });
            saveAssignments();
            renderAssignments();
        }

        function deleteAssignment(id) {
            assignments = assignments.filter(item => item.id !== id);
            saveAssignments();
            renderAssignments();
        }

        function getRemainingTime(dueDateStr) {
            const now = new Date();
            const due = new Date(dueDateStr);
            const diffTime = due - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffTime < 0) {
                return { text: '마감됨', urgent: false, expired: true };
            } else if (diffDays === 0) {
                const diffHours = Math.ceil(diffTime / (1000 * 60 * 60));
                if (diffHours <= 1) return { text: '마감 임박 (1시간 이내)', urgent: true, expired: false };
                return { text: `오늘 마감 (${diffHours}시간 남음)`, urgent: true, expired: false };
            } else if (diffDays === 1) {
                return { text: '내일 마감 (D-1)', urgent: true, expired: false };
            } else {
                return { text: `D-${diffDays}`, urgent: diffDays <= 3, expired: false };
            }
        }

        function formatDateString(dateStr) {
            const date = new Date(dateStr);
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const hours = date.getHours();
            const minutes = date.getMinutes();
            const ampm = hours >= 12 ? '오후' : '오전';
            const formattedHours = hours % 12 || 12;
            const formattedMinutes = minutes < 10 ? '0' + minutes : minutes;
            return `${month}월 ${day}일 (${ampm} ${formattedHours}:${formattedMinutes})`;
        }

        const colorStyles = {
            indigo: { badge: 'bg-indigo-50 text-indigo-700 border-indigo-200', dot: 'bg-indigo-600' },
            blue: { badge: 'bg-blue-50 text-blue-700 border-blue-200', dot: 'bg-blue-500' },
            emerald: { badge: 'bg-emerald-50 text-emerald-700 border-emerald-200', dot: 'bg-emerald-500' },
            amber: { badge: 'bg-amber-50 text-amber-700 border-amber-200', dot: 'bg-amber-500' },
            rose: { badge: 'bg-rose-50 text-rose-700 border-rose-200', dot: 'bg-rose-500' }
        };

        function renderAssignments() {
            const listContainer = document.getElementById('assignmentList');
            const emptyState = document.getElementById('emptyState');
            const statsBadge = document.getElementById('statsBadge');

            const filtered = assignments.filter(item => {
                if (currentFilter === 'active') return !item.completed;
                if (currentFilter === 'completed') return item.completed;
                return true;
            });

            filtered.sort((a, b) => {
                if (a.completed !== b.completed) return a.completed ? 1 : -1;
                return new Date(a.dueDate) - new Date(b.dueDate);
            });

            const activeCount = assignments.filter(i => !i.completed).length;
            statsBadge.textContent = `진행중 ${activeCount}건`;

            if (filtered.length === 0) {
                listContainer.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            emptyState.classList.remove('flex');
            emptyState.classList.add('hidden');

            let html = '';
            filtered.forEach(item => {
                const timeInfo = getRemainingTime(item.dueDate);
                const colorTheme = colorStyles[item.color] || colorStyles.indigo;
                
                let badgeClass = colorTheme.badge;
                if (timeInfo.urgent && !item.completed && !timeInfo.expired) {
                    badgeClass = 'bg-rose-50 text-rose-700 border-rose-200 font-bold animate-pulse';
                }
                if (item.completed) {
                    badgeClass = 'bg-slate-100 text-slate-500 border-slate-200';
                }

                html += `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 transition hover:shadow-md flex items-center justify-between space-x-3 ${item.completed ? 'opacity-60 bg-slate-50/50' : ''}">
                        <div class="flex items-start space-x-3.5 flex-1 min-w-0">
                            <button onclick="toggleAssignment(${item.id})" class="mt-1 flex-shrink-0 w-6 h-6 rounded-full border-2 ${item.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 hover:border-indigo-600 bg-white'} flex items-center justify-center transition shadow-sm">
                                ${item.completed ? '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>' : ''}
                            </button>
                            <div class="flex-1 min-w-0">
                                <h2 class="text-sm font-semibold text-slate-900 truncate ${item.completed ? 'line-through text-slate-400' : ''}">${escapeHtml(item.title)}</h2>
                                <p class="text-xs text-slate-500 mt-0.5">${formatDateString(item.dueDate)}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 flex-shrink-0">
                            <span class="text-xs px-2.5 py-1 rounded-full border font-medium ${badgeClass}">
                                ${timeInfo.text}
                            </span>
                            <button onclick="deleteAssignment(${item.id})" class="text-slate-300 hover:text-rose-500 p-1.5 rounded-lg hover:bg-rose-50 transition" title="삭제">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = html;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
